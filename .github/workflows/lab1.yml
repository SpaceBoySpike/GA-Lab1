name: "Lab 1"
on:
  push:
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  Build:
    runs-on: Ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: "Setup Node.js"
        uses: actions/setup-node@v3
        with:
          node-version: "22"
          cache: "npm"

      - name: "Install dependencies"
        run: npm ci

      - name: "Build"
        run: npm run build
  Test:
    needs: Build
    runs-on: Ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: "Setup Node.js"
        uses: actions/setup-node@v3
        with:
          node-version: "22"
          cache: "npm"

      - name: "Install dependencies"
        run: npm ci

      - name: "Run tests"
        run: |
          echo "running tests..."
          npm test
          echo "running tests...done"
  Lint:
    needs: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: "Setup Node.js"
        uses: actions/setup-node@v3
        with:
          node-version: "22"
          cache: "npm"

      - name: "Install dependencies"
        run: npm ci

      - name: "Lint"
        run: |
          echo "linting code..."
          npm run lint
          echo "linting code...done"

  DependabotSummary:
    if: always() && github.actor == 'dependabot[bot]'
    needs: [Build, Test, Lint]
    runs-on: ubuntu-latest
    steps:
      - name: "Write Dependabot results to summary"
        env:
          BUILD_RESULT: ${{ needs.Build.result }}
          TEST_RESULT: ${{ needs.Test.result }}
          LINT_RESULT: ${{ needs.Lint.result }}
        run: |
          {
            echo "## Dependabot CI results"
            echo
            echo "| Job | Result |"
            echo "| --- | --- |"
            echo "| Build | ${BUILD_RESULT} |"
            echo "| Test | ${TEST_RESULT} |"
            echo "| Lint | ${LINT_RESULT} |"
          } >> "$GITHUB_STEP_SUMMARY"