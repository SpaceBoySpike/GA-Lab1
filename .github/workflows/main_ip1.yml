name: Main yaml for Input Output Learning

on:
    workflow_dispatch:
        inputs:
          name:  
            description: "Input your name"
            required: true
            type: string

jobs:
    input-output:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v3

            - name: Sending input to Action
              id: input-output
              uses: ./.github/actions/ip1
              with:
                name: ${{ github.event.inputs.name }}

            - name: Getting output from Action
              run: |
                echo "Output from Main yaml"
                echo "${{ steps.input-output.outputs.greet_output }}"