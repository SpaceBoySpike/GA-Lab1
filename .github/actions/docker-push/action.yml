name: Docker Push Action
description: This action will push a Docker Image to a registry

inputs:
  image_name:
    description: 'Name of the image'
    required: true
    default: 'myapp'

runs:
  using: composite
  steps:
    - name: Download Image Artifact
      uses: actions/download-artifact@v4
      with:
        name: ${{ env.SAFE_ARTIFACT_NAME }}

    - name: Load Docker Image
      shell: bash
      run: |
        IMAGE=${{ env.SAFE_ARTIFACT_NAME }}
        docker load -i $IMAGE.tar

    - name: Push Docker Image
      shell: bash
      run: |
        IMAGE=${{ env.SAFE_ARTIFACT_NAME }}
        docker tag $IMAGE synoxy/github_action:v1
        if docker push synoxy/github_action:v1; then
          echo "✅ Docker push successful" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ Docker push failed" >> $GITHUB_STEP_SUMMARY
          exit 1
        fi