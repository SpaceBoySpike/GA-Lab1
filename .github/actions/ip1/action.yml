name: My Input Output Action
description: This action takes a name as input and outputs a greeting message.

inputs:
  name:
    description: 'Name to greet'
    required: true
    default: 'Marimo'
outputs:
  greet_output:
    description: 'Greeting message'
    value: ${{ steps.greet_user.outputs.greeting }}

runs:
  using: composite
  steps:
    - name: Greet the user
      id: greet_user
      shell: bash
      run: |
        greeting="Hello, ${{ inputs.name }}! from action.yaml"
        echo "greeting=$greeting" >> $GITHUB_OUTPUT