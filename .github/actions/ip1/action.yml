name: My Input Output Action
description: This action takes a name as input and outputs a greeting message.

inputs:
  name:
    description: 'Name to greet'
    required: true
    default: 'Marimo'

runs:
  using: composite
  steps:
    - name: Greet the user
      shell: bash
      run: |
        echo "Hello, ${{ inputs.name }}!"