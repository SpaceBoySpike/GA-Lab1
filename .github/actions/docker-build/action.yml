name: Building Docker Image
description: This action will create a Docker Image

inputs:
  image_name:
    description: 'Name of the image'
    required: true
    default: 'myapp'

  tag:
    description: 'Tag for the image'
    required: true

outputs:
  image:
    description: 'Built Docker Image'
    value: ${{ steps.save_image.outputs.SAFE_ARTIFACT_NAME }}

runs:
  using: 'composite'
  steps:
    - name: Build Docker Image
      id: build_image
      shell: bash
      run: |
        IMAGE="${{ inputs.image_name }}:${{ inputs.tag }}"
        docker build -t $IMAGE . -f ./.github/actions/docker-build/Dockerfile
        echo "image=$IMAGE" >> $GITHUB_OUTPUT
    
    - name: Save image
      shell: bash
      id: save_image
      run: |
        IMAGE="${{ inputs.image_name }}:${{ inputs.tag }}"
        SAFE_ARTIFACT_NAME=$(echo "$IMAGE.tar" | tr ':' '-')
        docker save $IMAGE -o $SAFE_ARTIFACT_NAME
        echo "SAFE_ARTIFACT_NAME=$SAFE_ARTIFACT_NAME" >> $GITHUB_ENV
        echo "SAFE_ARTIFACT_NAME=$SAFE_ARTIFACT_NAME" >> $GITHUB_OUTPUT
    
    - name: Upload Built Image to Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.SAFE_ARTIFACT_NAME }}
        path: ${{ env.SAFE_ARTIFACT_NAME }}